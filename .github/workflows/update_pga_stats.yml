name: Update Tour Season Stats

on:
  schedule:
    - cron: '0 7 * * 1'     # Monday 2:00 AM CDT
    - cron: '0 1 * * 2'     # Monday 8:00 PM CDT (backup)
  workflow_dispatch:
    inputs:
      tour:
        description: 'Which tour to update'
        required: true
        default: 'pga'
        type: choice
        options:
          - pga
          - kft
          - dp
          - all

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run selected tour(s)
        run: |
          if [ "${{ github.event.inputs.tour }}" = "all" ] || [ -z "${{ github.event.inputs.tour }}" ]; then
            python scripts/generate_tour_stats.py pga
            python scripts/generate_tour_stats.py kft
            python scripts/generate_tour_stats.py dp
          else
            python scripts/generate_tour_stats.py ${{ github.event.inputs.tour }}
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Auto update tour season stats $(date -u +%Y-%m-%d)"
            git push
          )
