name: Update Tournament History

on:
  workflow_dispatch:
    inputs:
      tournament:
        description: 'Tournament key (e.g. rocket_classic)'
        required: true
        default: 'rocket_classic'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Generate tournament history
        run: python scripts/generate_tournament_history.py ${{ github.event.inputs.tournament }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tournaments/
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update ${{ github.event.inputs.tournament }} history $(date -u +%Y-%m-%d)"
            git push
          )
