name: Update Upcoming Field Data

on:
  schedule:
    # Runs every day at 8:00 AM CDT (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:   # Allows you to manually trigger the update

jobs:
  update-field:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest field from Google Sheets
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vTYFnwmt5yHygXP28HHRrg47ARQgV0IKm3wnaxoIz8MnGJH_mcIj6HUY96tbl1j7vD2r8JRDgR1wVxD/pub?gid=2136420689&single=true&output=csv" -o data/upcoming_field.csv

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/upcoming_field.csv
          
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update upcoming field data from Google Sheets"
            git push
          fi
