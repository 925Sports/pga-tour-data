name: Update Slate Data (DK / Odds / Props)

on:
  schedule:
    # Every 3 hours
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate slate CSVs
        run: python scripts/generate_slate_data.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dk_salaries.csv data/betting_odds.csv data/props_combined.csv data/fantasy_points.csv data/underdog.csv data/prizepicks.csv || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update slate data (DK salaries, odds, props)"
          git push
