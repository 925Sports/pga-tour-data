name: Update Slate Data (DK / Odds / Props)

# PP + UD + combined props should refresh often during events.
# GitHub schedule cron can drift a few minutes; 15m is a solid live cadence.
on:
  schedule:
    # Every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate slate CSVs
        run: |
          python scripts/fetch_dk_salaries.py
          python scripts/generate_slate_data.py

      - name: Commit & push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only add files that exist (prizepicks may be empty some weeks)
          for f in data/dk_salaries.csv data/betting_odds.csv data/props_combined.csv data/fantasy_points.csv data/underdog.csv data/prizepicks.csv; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update slate data (DK salaries, odds, props)"
          # Retry push in case of concurrent workflow commits
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Push succeeded"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $i failed — retrying..."
            sleep 3
          done
          exit 1
