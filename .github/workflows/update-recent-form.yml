name: Update Recent Form & Field Logs

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Generate recent_form.csv
        run: python scripts/generate_recent_form.py

      - name: Generate field_player_logs.csv
        run: python scripts/generate_field_player_logs.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recent_form.csv data/field_player_logs.csv
          git diff --staged --quiet || git commit -m "Auto-update recent_form.csv and field_player_logs.csv"
          git push
