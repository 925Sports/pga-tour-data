name: Update Recent Form & Field Logs

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Which event field(s) to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - current
          - upcoming

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Generate recent_form (+ upcoming) and field logs
        env:
          EVENT_SCOPE: ${{ github.event.inputs.scope || 'both' }}
        run: |
          python scripts/generate_recent_form.py --scope "$EVENT_SCOPE"
          python scripts/generate_field_player_logs.py --scope "$EVENT_SCOPE"

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only add files that exist (upcoming is often skipped mid-week)
          for f in data/recent_form.csv data/recent_form_upcoming.csv \
                   data/field_player_logs.csv data/field_player_logs_upcoming.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update recent_form + field logs (current + upcoming)"
          # Retry pull --rebase + push (other Actions may commit at the same time)
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push attempt $i failed — retrying..."
            sleep 3
          done
          exit 1
