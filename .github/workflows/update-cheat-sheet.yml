name: Update Cheat Sheet Data

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which event field(s) to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - current
          - upcoming
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - "data/recent_form.csv"
      - "data/recent_form_upcoming.csv"
      - "data/field_player_logs.csv"
      - "data/field_player_logs_upcoming.csv"
      - "data/pga_tour_player_logs_*.csv"
      - "data/pre_tournament_preview.csv"
      - "data/pga_season_stats.csv"
      - "data/dp_world_season_stats.csv"
      - "scripts/generate_cheat_sheet.py"
      - "scripts/field_utils.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas
      - name: Generate cheat sheet CSVs (current + upcoming)
        env:
          EVENT_SCOPE: ${{ github.event.inputs.scope || 'both' }}
        run: python scripts/generate_cheat_sheet.py --scope "$EVENT_SCOPE"
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cheat_sheet.csv data/cheat_sheet_upcoming.csv \
                  data/course_history_summary.csv data/course_history_summary_upcoming.csv || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update cheat_sheet + course_history (current + upcoming)"
          set +e
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push attempt $i failed — retrying..."
            sleep 3
          done
          exit 1
