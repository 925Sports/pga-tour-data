name: Update Cheat Sheet Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  push:
    paths:
      - "data/recent_form.csv"
      - "data/field_player_logs.csv"
      - "data/pga_tour_player_logs_*.csv"
      - "scripts/generate_cheat_sheet.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pandas

      - name: Generate cheat sheet CSVs
        run: python scripts/generate_cheat_sheet.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cheat_sheet.csv data/course_history_summary.csv || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-update cheat_sheet + course_history_summary"

          # Remote may have moved (other workflows / manual pushes). Rebase then push.
          set +e
          for i in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push attempt $i failed — retrying..."
            sleep 3
          done
          echo "Push failed after retries"
          exit 1
