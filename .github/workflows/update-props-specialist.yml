name: Update Props + Specialist Boards

on:
  workflow_dispatch:
  schedule:
    - cron: "20 * * * *"
  push:
    paths:
      - "data/props_combined.csv"
      - "data/field_player_logs.csv"
      - "data/recent_form.csv"
      - "scripts/generate_props_board.py"
      - "scripts/generate_specialist_board.py"
      - "scripts/generate_custom_model_defaults.py"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas
      - name: Generate boards
        run: |
          python scripts/generate_props_board.py
          python scripts/generate_specialist_board.py
          python scripts/generate_custom_model_defaults.py
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/props_board.csv data/specialist_board.csv data/custom_model_defaults.json || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Auto-update props_board + specialist_board + CM defaults"
          git pull --rebase origin main || true
          git push
